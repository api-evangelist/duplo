aid: duplo
name: Duplo
description: >-
  Duplo is a fintech company building the financial operating system for African and
  emerging-market businesses, headquartered in Lagos, Nigeria with operations in South Africa.
  Its platform unifies B2B payments and spend management: automated expense tracking with
  approval workflows, local and international (cross-border) payments, multi-currency global
  business accounts, NRS-compliant e-invoicing, direct debit, tax management, auto
  reconciliation, bulk payments to up to 500 recipients, and real-time financial reporting.
  For developers, Duplo exposes Atlas, a global payments API (base host atlas.tryduplo.com)
  covering collections/checkout, disbursements and bulk payouts, virtual accounts, payment
  links, exchange rates and FX swaps, wallet management, and e-invoicing, authenticated with
  Bearer API keys and delivering event notifications via webhooks. Duplo maintains PCI DSS,
  ISO 27001 and ISO 22301 certifications, is NDPR compliant, and operates under Central Bank
  of Nigeria oversight as a licensed Payment Service Solution Provider (PSSP).
