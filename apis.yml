    Atlas is Duplo's global payments API for African and emerging-market businesses: collect
    payments (checkout, payment links, virtual accounts), disburse funds (single and bulk bank
    payouts, international transfers), run exchange-rate lookups and FX swaps, manage wallets,
    and issue NRS e-invoices. Authenticated with Bearer API keys, with test and live modes
    selected by the key, and webhook event notifications.
